name: Update visual baselines

# Regenerates Playwright screenshot baselines inside the pinned container and
# commits them to the branch it runs on. Run manually after intentional UI changes.
on:
  workflow_dispatch:
  push:
    paths: ["e2e/visual.spec.ts", ".github/workflows/visual-baselines.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      HOME: /root
    steps:
      - name: Ensure git (checkout needs it to allow committing)
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v4
      - name: Skip if baselines already exist (push trigger bootstraps only)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -d e2e/__screenshots__/ci ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        name: Build tools for native modules (better-sqlite3)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        run: npx playwright test e2e/visual.spec.ts e2e/onboarding.setup.ts --update-snapshots=all
        env:
          VISUAL_BASELINE_SET: ci
      - name: Commit baselines
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__/ci
          git diff --cached --quiet || git commit -m "test: update visual baselines"
          git push
