name: Android app

# Native Jarvis app (android/): unit, contract, UI and screenshot tests, then a
# signed APK. The server address comes from pairing, so one APK fits any Jarvis.
# Signing secrets: see docs/android.md.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub release with the APK (direct download on your phone)"
        type: boolean
        default: false
      record_screenshots:
        description: "Re-record screenshot baselines and commit them (after an intended UI change)"
        type: boolean
        default: false
  push:
    paths:
      - "android/**"
      - "contracts/api/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "contracts/api/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  app:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Validate release signing
        env:
          RELEASE: ${{ inputs.release == true }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Release requires all four persistent Android signing secrets. See docs/android.md."
                exit 1
              fi
            done
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 37.2 (compile) + build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Record screenshot baselines
        if: ${{ inputs.record_screenshots }}
        run: |
          ./gradlew --no-daemon recordRoborazziDebug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          git diff --cached --quiet || (git commit -m "android: update screenshot baselines" && git push)

      - name: Tests (unit, contract, UI) + screenshot verification
        if: ${{ !inputs.record_screenshots }}
        run: ./gradlew --no-daemon verifyRoborazziDebug

      - name: Screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-diffs
          path: |
            android/app/build/outputs/roborazzi/
            android/app/build/reports/tests/
            android/app/src/test/screenshots/*_compare.png
            android/app/src/test/screenshots/*_actual.png
          if-no-files-found: ignore

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/jarvis.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            alias="$KEY_ALIAS"; storepass="$KEYSTORE_PASSWORD"; keypass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key. Updates won't install over this APK. See docs/android.md."
            alias=jarvis; storepass=$(openssl rand -hex 16); keypass=$storepass
            keytool -genkeypair -keystore "$ks" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$storepass" -keypass "$keypass" -dname "CN=Jarvis" -noprompt
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$storepass"
          echo "::add-mask::$keypass"
          {
            echo "JARVIS_KEYSTORE=$ks"
            echo "JARVIS_KEYSTORE_PASSWORD=$storepass"
            echo "JARVIS_KEY_ALIAS=$alias"
            echo "JARVIS_KEY_PASSWORD=$keypass"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/jarvis-1.0.${{ github.run_number }}.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify "../dist/jarvis-1.0.${{ github.run_number }}.apk"

      - name: Summary
        run: |
          {
            echo "### Jarvis for Android 1.0.${{ github.run_number }}"
            echo
            echo "Signing key: ${{ steps.key.outputs.persistent == 'true' && 'persistent (from secrets)' || '**throwaway** (set the signing secrets, see docs/android.md)' }}"
            echo
            echo "Install, open it, and scan the code from Jarvis on the web → Settings → Phones."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-1.0.${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.release && steps.key.outputs.persistent == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release create "android-1.0.${{ github.run_number }}" dist/*.apk \
            --target "${{ github.sha }}" \
            --title "Jarvis for Android 1.0.${{ github.run_number }}" \
            --notes "Install the APK, open Jarvis and scan the pairing code from Settings → Phones on the web."
