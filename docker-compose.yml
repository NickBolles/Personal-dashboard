# Jarvis on the home server, behind the existing Traefik.
#   cp .env.example .env   # fill in JARVIS_DOMAIN etc.
#   docker compose up -d --build
#   docker compose logs jarvis   # shows the one-time setup code on first boot
#
# Demo mode (bundled mock upstreams, no real services needed):
#   docker compose --profile demo up -d --build
name: jarvis

services:
  jarvis:
    build:
      context: .
      args:
        JARVIS_VERSION: ${JARVIS_VERSION:-dev}
    image: ${JARVIS_IMAGE:-jarvis-dashboard:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Chicago}
      JARVIS_PUBLIC_ORIGIN: https://${JARVIS_DOMAIN:-jarvis.localhost}
      JARVIS_AUTH_MODE: ${JARVIS_AUTH_MODE:-local}
      JARVIS_VAPID_SUBJECT: ${JARVIS_VAPID_SUBJECT:-mailto:admin@localhost}
      # Only set by the demo profile; enables "Use demo values" in onboarding.
      JARVIS_MOCK_UPSTREAM_URL: ${JARVIS_MOCK_UPSTREAM_URL:-}
    volumes:
      - jarvis-data:/data
    ports:
      # Direct LAN access (optional). Remove if you only want Traefik.
      - "${JARVIS_PORT:-3000}:3000"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.jarvis.rule: Host(`${JARVIS_DOMAIN:-jarvis.localhost}`)
      traefik.http.routers.jarvis.entrypoints: ${TRAEFIK_ENTRYPOINTS:-websecure}
      traefik.http.routers.jarvis.tls: "true"
      traefik.http.routers.jarvis.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-mytlschallenge}
      traefik.http.services.jarvis.loadbalancer.server.port: "3000"
      traefik.http.middlewares.jarvis-headers.headers.stsSeconds: "31536000"
      traefik.http.routers.jarvis.middlewares: ${TRAEFIK_MIDDLEWARES:-jarvis-headers}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mock:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.mock
    restart: unless-stopped
    networks: [default]

volumes:
  jarvis-data:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
